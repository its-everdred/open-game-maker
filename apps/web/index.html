<!doctype html>
<html lang="en" style="background: #282828">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#282828" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Game Maker" />
    <meta property="og:url" content="https://makeopen.games/" />
    <title>Open Game Maker 2000</title>
    <link rel="canonical" href="https://makeopen.games/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;family=Press+Start+2P&amp;family=Bungee&amp;family=Creepster&amp;family=Lilita+One&amp;family=Russo+One&amp;display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      href="/town/models/bake/poster-portrait.webp"
      media="(orientation: portrait)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/town/models/bake/poster-landscape.webp"
      media="(orientation: landscape)"
      fetchpriority="high"
    />
    <style>
      #initial-title-poster,
      #initial-title-poster img {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #initial-title-poster {
        background: #282828;
      }

      #initial-title-poster img {
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <picture id="initial-title-poster" aria-hidden="true">
        <source media="(orientation: portrait)" srcset="/town/models/bake/poster-portrait.webp" />
        <img alt="" src="/town/models/bake/poster-landscape.webp" fetchpriority="high" />
      </picture>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
