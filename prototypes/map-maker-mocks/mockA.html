<html><head><link rel="stylesheet" href="ui.css"><style>
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;z-index:900000}
.pill{display:flex;gap:6px;padding:6px;border-radius:999px}
.tray{position:absolute;z-index:900000;border-radius:26px 26px 0 0;padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;gap:6px;padding:6px;border-radius:999px;width:max-content;margin:0 auto}
.kinds{display:grid;gap:8px}
.grid{display:grid;gap:8px}
.float{position:absolute;z-index:900001;display:flex;gap:4px;padding:5px;border-radius:999px;transform:translate(-50%,-100%)}
.float .btn{width:44px;height:44px}
.handle{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto}
.strip{position:absolute;left:12px;right:12px;top:76px;z-index:900000;display:flex;gap:10px;padding:10px;border-radius:24px;overflow:hidden}
</style></head><body><div class="stage"><div class="world" id="w"></div></div>
<script src="iso.js"></script><script src="scene.js"></script><script src="icons.js"></script><script src="panels.js"></script><script>
const Q=new URLSearchParams(location.search), P=(Q.get('v')||'phone')==='phone', st=Q.get('s')||'edit';
const VW=innerWidth, VH=innerHeight, s=P?(st==='browse'?0.3:0.36):0.62, ox=VW/2+(P?-10:0), oy=P?(st==='scenes'?300:st==='browse'?140:250):150;
const L=document.getElementById('w');
buildScene(L,ox,oy,s);
const H=(h)=>document.body.insertAdjacentHTML('beforeend',h);
const tools=(on)=>`<div class="tools glass">${btn('select')}${btn('brush',on==='brush'?'on':'','paint ground')}${btn('fence',on==='fence'?'on':'','draw fences and walls')}${btn('erase')}${btn('layers')}${btn('sun',on==='sun'?'on':'','light and mood')}</div>`;
const topBar=`<div class="top"><div class="pill glass">${btn('close')}${btn('map',st==='scenes'?'on':'','scenes')}</div><div class="pill glass">${btn('undo')}${btn('redo')}</div><div class="pill glass">${btn('play','','test play')}${btn('check','go','save')}</div></div>`;
const trayPos=P?'left:0;right:0;bottom:0':'left:50%;bottom:0;width:880px;transform:translateX(-50%)';
const kinds=[{ground:'ground_a2_e'},{fence:'b1'},{wall:'wall_f1_s'},{prop:'stone_a13_e'},{prop:'tree_a1_e'},{char:'knight_idle'}];
const items=[{fence:'b1'},{fence:'b3'},{fence:'b6'},{fence:'a1'},{fence:'a3'},{fence:'a6'},{wall:'wall_f1_s'},{wall:'wall_f6_s'}];
const editTray=`<div class="tray glass" style="${trayPos}">${tools('fence')}
 <div class="kinds" style="grid-template-columns:repeat(6,1fr)">${kinds.map((k,i)=>mini(k,i===1,P?46:52)).join('')}</div>
 <div class="grid" style="grid-template-columns:repeat(${P?4:8},1fr)">${items.map((k,i)=>mini(k,i===0,P?84:96)).join('')}</div></div>`;
if(st==='edit'||st==='scenes'){
  mark(L,2,2,ox,oy,s,'background:rgba(255,191,50,.35);outline:2px solid #ffbf32');
  for(const x of [5,6,7]){mark(L,x,5,ox,oy,s,'background:rgba(148,215,66,.35)');Iso.fence(L,'b1',x,5,'yMin',ox,oy,s,'opacity:.75;filter:drop-shadow(0 0 4px #94d742)');}
  H(topBar+editTray);
  if(st==='edit'){const [fx,fy]=at(7.4,5.3,ox,oy,s),[sx,sy]=at(2.5,2,ox,oy,s);
    H(`<div class="float glass" style="left:${sx}px;top:${sy-60*s}px">${btn('rotate')}${btn('flip')}${btn('dup','','duplicate')}${btn('trash','','delete')}</div><div class="finger" style="left:${fx}px;top:${fy}px"></div>`);}
  else H(`<div class="strip glass">${SCENES.map((c,i)=>sceneCard(c,P?150:220,P?96:130,i)).join('')}<button class="btn" aria-label="new scene" style="flex:none;align-self:center">${ic('plus')}</button></div>`);
}
if(st==='browse'){
  mark(L,2,4,ox,oy,s,'background:rgba(148,215,66,.45);outline:2px solid #94d742');
  const [gx,gy]=at(2.5,4.5,ox,oy,s);
  H(topBar+`<div class="tray glass" style="${trayPos};height:${P?'60%':'52%'}"><div class="handle"></div>
   <div class="search">${ic('search')}<span style="flex:1"></span><span class="count">${LIB.total}</span></div>
   <div class="row">${LIB.kinds.map((k,i)=>kindChip(k,i===4)).join('')}</div>
   <div class="row">${LIB.subs.map((t,i)=>`<span class="chip ${i===0?'on':''}">${t}</span>`).join('')}${LIB.tags.map((t,i)=>`<span class="chip" style="background:none;outline:1px solid var(--rule)">${t}</span>`).join('')}</div>
   <div class="grid" style="grid-template-columns:repeat(${P?4:8},1fr)">${LIB.items.slice(0,P?12:16).map((k,i)=>labelled(k,i===1,P?78:90)).join('')}</div></div>`+dragGhost(gx,gy,{prop:'tree_a3_e'}));
}
if(st==='look'){
  applyLook(L,ox,oy,s,VW,VH);
  H(topBar+`<div class="tray glass" style="${trayPos}">${tools('sun')}${lookControls(false)}</div>`);
}
</script><style>.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--paper-2);color:var(--muted)}.search svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}</style></body></html>
