<html><head><link rel="stylesheet" href="ui.css"><style>
.bar{position:absolute;z-index:900000;display:flex;gap:6px;padding:6px;border-radius:999px}
.panel{position:absolute;z-index:900000;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px}
.packs{display:flex;gap:6px}
.packs .tile{width:52px;height:44px;flex:none}
.items{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:6px;padding:4px;border-radius:16px;background:var(--paper-2)}
.layer.on{outline:3px solid var(--yellow-b)}
.layer .btn{width:40px;height:40px}
.layer .dim{opacity:.45}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--paper-2);color:var(--muted)}
.search svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.mini-map{position:absolute;z-index:900000;border-radius:18px;overflow:hidden}
</style></head><body><div class="stage"><div class="world" id="w"></div></div>
<script src="iso.js"></script><script src="scene.js"></script><script src="icons.js"></script><script>
const v=new URLSearchParams(location.search).get('v')||'phone', P=v==='phone';
const VW=innerWidth, VH=innerHeight, s=P?0.3:0.74, ox=P?VW/2:650, oy=P?260:150;
const L=document.getElementById('w');
buildScene(L,ox,oy,s);
// grid overlay (snap)
gridLines(L,8,7,ox,oy,s);
// ghost placement: iron corner piece snapped at (5,5)
mark(L,5,5,ox,oy,s,'background:rgba(148,215,66,.4);outline:2px solid #94d742');
Iso.rural(L,'fence_b6_n',5,5,ox,oy,s,40,'opacity:.75;filter:drop-shadow(0 0 4px #94d742)');
const packs=[{ground:'ground_a2_e'},{fence:'a1'},{char:'warrior_idle'}];
const items=[{fence:'b1'},{fence:'b3'},{fence:'b6'},{fence:'a1'},{fence:'a3'},{fence:'a6'},{wall:'wall_f1_s'},{wall:'wall_f6_s'},{prop:'stone_a4_e'},{prop:'stone_a13_e'},{prop:'stone_a5_e'},{prop:'tree_b4_e'}];
const layers=[['roof',0,1],['tree',0,0],['fence',1,0],['ground',0,0],['person',0,0]];
const layerRows=layers.map(([n,on,hid])=>`<div class="layer ${on?'on':''}">${btn(n,'',n+' layer')}<span style="flex:1"></span>${btn(hid?'eyeoff':'eye',hid?'dim':'')}${P?'':btn('lock','dim')}</div>`).join('');
const tools=`${btn('select')}${btn('brush','', 'paint')}${btn('fence','on','place')}${btn('erase')}${btn('rotate')}${btn('flip')}${btn('magnet','on','snap to grid')}`;
if(!P){
 document.body.insertAdjacentHTML('beforeend',`
 <div class="bar glass" style="left:12px;top:12px">${btn('close')}</div>
 <div class="bar glass" style="left:50%;top:12px;transform:translateX(-50%)">${tools}</div>
 <div class="bar glass" style="right:12px;top:12px">${btn('undo')}${btn('redo')}${btn('play','', 'test play')}${btn('check','go','save')}</div>
 <div class="panel glass" style="left:12px;top:84px;width:300px">
  <div class="search">${'<svg viewBox="0 0 24 24">'+IC.search+'</svg>'}</div>
  <div class="packs">${packs.map((k,i)=>mini(k,i===1,44)).join('')}</div>
  <div class="items" style="grid-template-columns:repeat(3,1fr)">${items.map((k,i)=>mini(k,i===2,84)).join('')}</div>
 </div>
 <div class="panel glass" style="right:12px;top:84px;width:190px">${layerRows}</div>`);
} else {
 document.body.insertAdjacentHTML('beforeend',`
 <div class="bar glass" style="left:10px;top:10px">${btn('close')}</div>
 <div class="bar glass" style="right:10px;top:10px">${btn('undo')}${btn('redo')}${btn('check','go','save')}</div>
 <div class="bar glass" style="left:10px;top:84px;flex-direction:column;border-radius:30px">${btn('select')}${btn('brush','', 'paint')}${btn('fence','on','place')}${btn('erase')}${btn('rotate')}${btn('flip')}${btn('magnet','on','snap to grid')}</div>
 <div class="bar glass" style="right:10px;top:84px;flex-direction:column;border-radius:30px">${layers.map(([n,on,hid])=>btn(n,on?'on':'',n+' layer').replace('class="btn','style="'+(hid?'opacity:.4':'')+'" class="btn')).join('')}</div>
 <div class="panel glass" style="left:0;right:0;bottom:0;border-radius:24px 24px 0 0;padding-bottom:16px">
  <div class="packs">${packs.map((k,i)=>mini(k,i===1,44)).join('')}<div class="search" style="flex:1">${'<svg viewBox="0 0 24 24">'+IC.search+'</svg>'}</div></div>
  <div class="items" style="grid-template-columns:repeat(4,1fr)">${items.slice(0,8).map((k,i)=>mini(k,i===2,78)).join('')}</div>
 </div>`);
}
</script></body></html>
