<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause menu</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div class="scrim"></div>
<div class="sheet pane strong">
<div style="display:flex;align-items:center;gap:10px;padding:16px 14px 10px 20px">
<h1 class="h1" style="flex:1">Paused</h1>
<a class="orb go" href="PlayView.html" aria-label="Resume" style="color:#1d1b16"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"></path></svg></a>
</div>
<div style="padding:0 14px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;justify-items:center">
<a class="orb new lg" href="Editor.html" aria-label="Edit" style="color:#1d1b16"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></a>
<a class="orb lg" href="AgentChat.html" aria-label="Ask for a change"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg></a>
<a class="orb lg" href="BugReport.html" aria-label="Report a bug" style="color:#ff9b8f"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="8" width="10" height="12" rx="5"></rect><path d="M12 11v9M7 13H3M21 13h-4M7 18l-3 2M17 18l3 2M9.5 8a2.5 2.5 0 0 1 5 0"></path></svg></a>
<a class="orb lg" href="Home.html" aria-label="Quit to games"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></a>
</div>
<div style="flex:1;min-height:0;overflow:hidden;padding:8px 14px 14px;display:flex;flex-direction:column;gap:18px">
<div class="sec"><div class="cap">Needs you <span class="cnt">1</span></div>
<a class="row" href="Review.html" style="border-color:rgba(255,145,51,.55);background:linear-gradient(180deg,rgba(255,145,51,.16),rgba(255,145,51,.06));padding:8px">
<img src="../../assets-local/review/design-ogm-glass/img/thumb-16.jpg" alt="" style="width:60px;height:60px;border-radius:14px;object-fit:cover">
<div class="grow"><div class="t">UI kit · liquid orbs</div><div class="s">Round 4</div></div><span class="btn warn sm">Review</span></a>
</div>
<div class="sec"><div class="cap">Work <span class="cnt">2</span></div>
<a class="row" href="TicketChat.html" style="flex-direction:column;align-items:stretch;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px"><span class="t" style="flex:1">Dusk and torch</span><span class="num" style="color:#74c8ed">80%</span></div>
<div class="bar"><b style="width:80%"></b></div>
<div style="display:flex;align-items:center;gap:8px;min-width:0"><span class="pill work">Working</span><span class="s">Warmer torch or cooler dusk?</span></div></a>
<a class="row" href="TicketChat.html" style="flex-direction:column;align-items:stretch;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px"><span class="t" style="flex:1">Forest road</span><span class="num" style="color:#74c8ed">55%</span></div>
<div class="bar"><b style="width:55%"></b></div>
<div style="display:flex;align-items:center;gap:8px;min-width:0"><span class="pill work">Working</span><span class="s">Placing tree clusters</span></div></a>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<a class="meter" href="Resources.html" style="color:#f2ead6"><span class="hd"><img src="img/minerals.svg" alt="" style="width:20px;height:20px">Minerals<b>62%</b></span><span class="bar thin min"><b style="width:62%"></b></span><span class="r">Resets Thu 09:00</span></a>
<a class="meter" href="Resources.html" style="color:#f2ead6"><span class="hd"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7f171"></stop><stop offset=".55" stop-color="#46c46a"></stop><stop offset="1" stop-color="#1f8a52"></stop></linearGradient></defs><path d="M4 18.5 6.2 11l4-2.6 4.6 1.2 3.4 3.6.8 5.3-3.8 1.7H7.6z" fill="url(#gg)"></path></svg>Gas<b>40%</b></span><span class="bar thin gas"><b style="width:40%"></b></span><span class="r">$2.00 of $5.00</span></a>
</div>
<div class="slider" style="padding:4px 8px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg><div class="track" role="slider" aria-label="Volume" aria-valuenow="70" tabindex="0"><b style="width:70%"></b><i style="left:70%"></i></div><a class="orb sm" href="Settings.html" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></a></div>
</div>
</div>
</div>
<script src="fallback.js"></script>
</body>
</html>
