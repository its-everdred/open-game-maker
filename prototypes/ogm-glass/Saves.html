<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saves and snapshots</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.snap{display:flex;flex-direction:column;gap:6px;border-radius:16px;overflow:hidden;background:rgba(57,54,67,.5);border:1px solid rgba(242,234,214,.1);padding:0 0 10px;color:#f2ead6;text-align:left}
.snap img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.snap b{font:600 15px Fredoka;padding:0 10px}.snap span{font:700 12px Nunito;color:#c4beb0;padding:0 10px}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div class="scrim"></div>
<div class="sheet pane strong" style="top:60px">
<div style="display:flex;align-items:center;gap:10px;padding:16px 12px 10px 18px">
<h1 class="h2" style="flex:1">Saves</h1>
<button class="orb sm new" aria-label="Take a snapshot" style="color:#1d1b16"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
<a class="orb sm" href="PauseMenu.html" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="padding:4px 14px 16px;display:flex;flex-direction:column;gap:16px">
<div class="row"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#74c8ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"></path><path d="M9 13l2 2 4-4"></path></svg><div class="grow"><div class="t" style="font-size:16px">Synced</div><div class="s">Phone and laptop · 2 min ago</div></div></div>
<div class="sec"><div class="cap">Snapshots</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button class="snap"><img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt=""><b>Before the boss</b><span>Today · v14</span></button>
<button class="snap"><img src="../../assets-local/review/design-ogm-glass/img/land-bg.jpg" alt=""><b>Camp bug</b><span>Yesterday · v13 · bug</span></button>
<button class="snap"><img src="../../assets-local/review/design-ogm-glass/img/dusk.jpg" alt=""><b>Cave 2 start</b><span>Mon · v13 · review</span></button>
</div></div>
</div>
</div>
</div>
<script src="fallback.js"></script>
</body>
</html>
