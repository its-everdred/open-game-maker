<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.grp{display:flex;flex-direction:column;gap:2px;border-radius:20px;overflow:hidden}
.grp .row{border-radius:4px}
.grp .row:first-child{border-radius:18px 18px 4px 4px}.grp .row:last-child{border-radius:4px 4px 18px 18px}.grp .row:only-child{border-radius:18px}
.lbl{font:600 16px Fredoka;width:84px;flex:none}</style>
</head>
<body>
<div class="g phone">
<div class="glows" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top">
<a class="orb sm" href="Home.html" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="h1" style="font-size:26px;line-height:40px">Settings</h1>
</div>
<div style="position:absolute;inset:76px 14px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<a class="row" href="Account.html" style="min-height:68px"><span style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--gloss),#a95bd1;font:700 20px Fredoka;color:#1d1b16">K</span><div class="grow"><div class="t">Kim</div><div class="s">Game maker · kim@example.com</div></div><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#c4beb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
<div class="sec"><div class="cap">Sound</div>
<div class="grp">
<div class="row"><span class="lbl">Music</span><div class="slider" style="flex:1"><div class="track" role="slider" aria-label="Music" aria-valuenow="60" tabindex="0"><b style="width:60%"></b><i style="left:60%"></i></div></div></div>
<div class="row"><span class="lbl">Effects</span><div class="slider" style="flex:1"><div class="track" role="slider" aria-label="Effects" aria-valuenow="85" tabindex="0"><b style="width:85%"></b><i style="left:85%"></i></div></div></div>
</div></div>
<div class="sec"><div class="cap">Display and controls</div>
<div class="grp">
<div class="row"><span class="lbl">Text</span><div class="seg" role="group" aria-label="Text size" style="flex:1"><button aria-pressed="false">S</button><button aria-pressed="true">M</button><button aria-pressed="false">L</button></div></div>
<div class="row"><span class="lbl">Buttons</span><div class="seg" role="group" aria-label="Touch button side" style="flex:1"><button aria-pressed="true" aria-label="Right handed"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin:auto"><rect x="3" y="6" width="18" height="12" rx="3"></rect><circle cx="16.5" cy="12" r="2.5" fill="currentColor"></circle></svg></button><button aria-pressed="false" aria-label="Left handed"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin:auto"><rect x="3" y="6" width="18" height="12" rx="3"></rect><circle cx="7.5" cy="12" r="2.5" fill="currentColor"></circle></svg></button></div></div>
</div></div>
<div class="sec"><div class="cap">Voice</div>
<div class="grp">
<div class="row"><span class="t grow" style="font-size:16px">Talk live with agents</span><button class="switch" role="switch" aria-checked="true" aria-label="Talk live with agents"></button></div>
<div class="row"><span class="t grow" style="font-size:16px">Read replies aloud</span><button class="switch" role="switch" aria-checked="false" aria-label="Read replies aloud"></button></div>
</div></div>
<div class="sec"><div class="cap">Resources</div>
<a href="Resources.html" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;color:#f2ead6">
<span class="meter"><span class="hd"><img src="img/minerals.svg" alt="" style="width:20px;height:20px">Minerals<b>62%</b></span><span class="bar thin min"><b style="width:62%"></b></span></span>
<span class="meter"><span class="hd"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7f171"></stop><stop offset=".55" stop-color="#46c46a"></stop><stop offset="1" stop-color="#1f8a52"></stop></linearGradient></defs><path d="M4 18.5 6.2 11l4-2.6 4.6 1.2 3.4 3.6.8 5.3-3.8 1.7H7.6z" fill="url(#gg)"></path></svg>Gas<b>40%</b></span><span class="bar thin gas"><b style="width:40%"></b></span></span>
</a></div>
<div class="grp">
<a class="row" href="Settings.html"><span class="t grow" style="font-size:16px">Credits</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#c4beb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
</div>
</div>
</div>
</body>
</html>
