<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/town-phone.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.55) saturate(1.1);transform:scale(1.06)">
<img src="img/logo.webp" alt="Open Game Maker 2000" style="position:absolute;top:70px;left:50%;translate:-50% 0;width:240px;height:auto">
<form class="pane" style="position:absolute;left:16px;right:16px;top:300px;padding:24px 20px;display:flex;flex-direction:column;gap:18px">
<h1 class="h1">You're invited</h1>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94d742" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="#94d742" stroke="none"></path></svg>Play</span><span class="tag"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffbf32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Make games</span></div>
<div class="field"><label for="jn-email">Email</label><input id="jn-email" class="input" type="email" value="brother@example.com"></div>
<button class="btn go block" type="submit">Join</button>
<button class="btn ghost block" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M15 12v2"></path></svg>Join with a passkey</button>
</form>
</div>
<script src="fallback.js"></script>
</body>
</html>
