<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play view</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.pad{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:var(--gloss),rgba(40,36,52,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);display:grid;place-items:center;color:#f2ead6}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<a class="orb" href="PauseMenu.html" aria-label="Pause and menu" style="position:absolute;top:14px;right:14px;color:#f2ead6"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
<div class="pad" aria-label="Move" role="img" style="left:24px;bottom:44px;width:132px;height:132px"><span style="width:52px;height:52px;border-radius:50%;background:var(--gloss),rgba(242,234,214,.35);border:1px solid rgba(255,255,255,.55)"></span></div>
<button class="pad" aria-label="Attack" style="right:28px;bottom:70px;width:76px;height:76px"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4H20v5.5L9.5 20 4 14.5z"></path><path d="M7 13l4 4M5 19l2-2"></path></svg></button>
<button class="pad" aria-label="Roll" style="right:112px;bottom:36px;width:58px;height:58px"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"></path></svg></button>
<button class="pad" aria-label="Use" style="right:112px;bottom:118px;width:58px;height:58px"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a2 2 0 0 1 4 0v6M12 11V4a2 2 0 0 1 4 0v8M16 9a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L3.5 13a2 2 0 0 1 3.4-2L8 13"></path></svg></button>
</div>
<script src="fallback.js"></script>
</body>
</html>
