<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map builder browse</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.cell{border-radius:14px;overflow:hidden;aspect-ratio:1;border:1px solid rgba(242,234,214,.12);background:#1a1824;padding:0}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.crumb{display:flex;align-items:center;gap:6px;font:700 14px Nunito;color:#c4beb0}
.crumb b{color:#f2ead6}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div class="pane strong" style="position:absolute;left:0;right:0;bottom:0;top:200px;border-radius:28px 28px 0 0;padding:14px;display:flex;flex-direction:column;gap:12px">
<div aria-hidden="true" style="align-self:center;width:44px;height:5px;border-radius:3px;background:rgba(242,234,214,.35);margin-top:-6px"></div>
<div style="position:relative"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c4beb0" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:14px;top:16px"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><input class="input" aria-label="Search assets" placeholder="Search" style="padding-left:44px"></div>
<div class="seg" role="tablist" aria-label="Browse by"><button aria-pressed="true">Type</button><button aria-pressed="false">Set</button><button aria-pressed="false">Tags</button></div>
<div class="crumb">Nature<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg><b>Ground</b></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag" style="border-color:#94d742;color:#f2ead6">Forest</span><span class="tag">Path</span><span class="tag">Isometric</span><span class="tag">Night</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="cell" aria-label="Forest road tiles"><img src="../../assets-local/review/design-ogm-glass/img/thumb-41.jpg" alt=""></button>
<button class="cell" aria-label="Meadow"><img src="../../assets-local/review/design-ogm-glass/img/blobs.jpg" alt=""></button>
<button class="cell" aria-label="Cave floor"><img src="../../assets-local/review/design-ogm-glass/img/dusk.jpg" alt=""></button>
<button class="cell" aria-label="River bank"><img src="../../assets-local/review/design-ogm-glass/img/land-bg.jpg" alt="" style="object-position:20% 50%"></button>
<button class="cell" aria-label="Village path"><img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt=""></button>
<button class="cell" aria-label="Tavern floor"><img src="../../assets-local/review/design-ogm-glass/img/thumb-16.jpg" alt=""></button>
</div>
</div>
</div>
<script src="fallback.js"></script>
</body>
</html>
