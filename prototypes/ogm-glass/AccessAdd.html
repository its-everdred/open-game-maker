<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add editor</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 17px Fredoka;color:#f2ead6;flex:none;background:var(--gloss),rgba(116,200,237,.26)}
.orb.info{background:var(--gloss),#74c8ed;color:#1d1b16;border-color:rgba(255,255,255,.55)}
.flat{width:40px;height:40px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;padding:0;background:transparent;color:#c4beb0}
.flat.add{background:rgba(116,200,237,.18);color:#74c8ed}
.flat.send{background:#74c8ed;color:#1d1b16}
.row .bare{flex:1;min-width:0;height:36px;border:0;background:transparent;outline:none;padding:0;color:#f2ead6;font:600 16px Nunito}
.row .bare::placeholder{color:rgba(242,234,214,.45)}</style>
</head>
<body>
<div class="g phone">
<div class="glows" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top">
<a class="orb sm" href="Access.html" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="h1" style="font-size:26px;line-height:40px;flex:1">Add editor</h1>
</div>
<div style="position:absolute;inset:76px 14px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<label class="row" style="min-height:52px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input class="bare" type="search" placeholder="Players" aria-label="Search players"></label>
<div class="sec"><div class="cap">Players</div>
<div class="row"><span class="av">P</span><div class="grow"><div class="t" style="font-size:16px">[Player]</div><div class="s">Player</div></div><button class="flat add" type="button" aria-label="Add [Player]"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
<div class="row"><span class="av">T</span><div class="grow"><div class="t" style="font-size:16px">[Tester two]</div><div class="s">Game maker</div></div><button class="flat add" type="button" aria-label="Add [Tester two]"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
</div>
<div class="sec"><div class="cap">Invite by email</div>
<div class="row" style="padding:6px 6px 6px 14px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg><input class="bare" type="email" placeholder="Email" aria-label="Email"><button class="flat send" type="button" aria-label="Send invite"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></div>
</div>
</div>
</div>
</body>
</html>
