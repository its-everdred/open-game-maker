<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arena landscape</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.ctl{min-height:38px;padding:2px 10px 2px 14px}.ctl>.n{width:84px;font-size:13px}
.spawn{flex-direction:row;gap:4px;padding:2px 10px 2px 2px;font-size:12px}.spawn img{width:36px;height:36px}</style>
</head>
<body>
<div class="g" style="width:844px;height:390px">
<img src="../../assets-local/review/design-ogm-glass/img/land-bg.jpg" alt="Dusk Helm arena" style="position:absolute;left:0;top:0;width:504px;height:390px;object-fit:cover;object-position:52% 60%">
<nav class="picks pane" aria-label="Editor" style="position:absolute;left:8px;top:8px">
<button class="pick" aria-label="Map" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></button>
<button class="pick" aria-label="Arena" aria-pressed="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l11 11M4 4h4M4 4v4M20 4 9 15M20 4h-4M20 4v4M6 18l-2 2M18 18l2 2M7 13l4 4M17 13l-4 4"></path></svg></button>
<button class="pick" aria-label="Visuals" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button class="pick" aria-label="Characters" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></button>
<button class="pick" aria-label="Tuning" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
<button class="pick" aria-label="Audio" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></button>
<button class="pick" aria-label="Chat" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg></button>
</nav>
<div class="pane" style="position:absolute;left:66px;right:350px;bottom:8px;padding:6px;border-radius:22px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
<button class="spawn" aria-label="Spawn goblin, 3 placed"><img src="../../assets-local/review/design-ogm-glass/img/spr-goblin.png" alt=""><span class="dot" style="position:static">3</span></button>
<button class="spawn" aria-label="Spawn skeleton"><img src="../../assets-local/review/design-ogm-glass/img/spr-skeleton.png" alt=""></button>
<button class="spawn" aria-label="Spawn cave goblin, 2 placed"><img src="../../assets-local/review/design-ogm-glass/img/spr-cave-goblin.png" alt=""><span class="dot" style="position:static">2</span></button>
<button class="spawn" aria-label="Spawn boss"><img src="../../assets-local/review/design-ogm-glass/img/spr-boss.png" alt=""></button>
<button class="act danger" aria-label="Clear all enemies" style="min-height:40px;padding:0 12px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>5</button>
</div>
<section class="pane strong dp" aria-label="Arena" style="position:absolute;right:0;top:0;bottom:0;width:340px;border-radius:0">
<div class="dp-hd" style="padding-top:8px;padding-bottom:4px"><span class="h3">Arena</span><span class="chg-n" aria-label="3 changed">3</span><a class="orb sm" href="EditMenu.html" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></div>
<div class="dp-body" style="gap:6px">
<div class="grp-hd"><span class="cap">Combat</span></div>
<div class="ctl chg"><span class="n">Damage</span><div class="slider"><div class="track" role="slider" aria-label="Damage" aria-valuenow="1.4" tabindex="0"><b style="width:56%;background:#ffbf32"></b><i style="left:56%;width:20px;height:20px;margin:-10px 0 0 -10px"></i></div></div><span class="v">1.4×</span></div>
<div class="ctl"><span class="n">Knockback</span><div class="slider"><div class="track" role="slider" aria-label="Knockback" aria-valuenow="1" tabindex="0"><b style="width:40%"></b><i style="left:40%;width:20px;height:20px;margin:-10px 0 0 -10px"></i></div></div><span class="v">1.0</span></div>
<div class="ctl chg"><span class="n">Hit-stop</span><div class="slider"><div class="track" role="slider" aria-label="Hit-stop" aria-valuenow="90" tabindex="0"><b style="width:45%;background:#ffbf32"></b><i style="left:45%;width:20px;height:20px;margin:-10px 0 0 -10px"></i></div></div><span class="v">90ms</span></div>
<div class="ctl"><span class="n">Attack speed</span><div class="slider"><div class="track" role="slider" aria-label="Attack speed" aria-valuenow="1" tabindex="0"><b style="width:50%"></b><i style="left:50%;width:20px;height:20px;margin:-10px 0 0 -10px"></i></div></div><span class="v">1.0</span></div>
<div class="ctl chg"><span class="n">Aggression</span><div class="slider"><div class="track" role="slider" aria-label="Aggression" aria-valuenow="0.8" tabindex="0"><b style="width:80%;background:#ffbf32"></b><i style="left:80%;width:20px;height:20px;margin:-10px 0 0 -10px"></i></div></div><span class="v">0.8</span></div>
<div class="grp-hd" style="margin-top:4px"><span class="cap">Look</span></div>
<div class="ctl"><span class="n">HD-2D</span><div class="seg" role="group" aria-label="HD-2D preset"><button aria-pressed="false">Off</button><button aria-pressed="true">Dusk</button><button aria-pressed="false">Noon</button></div></div>
</div>
<div class="dp-ft" style="padding:6px 10px 8px"><button class="btn ghost sm" style="flex:1;min-height:40px">Revert</button><button class="btn go sm" style="flex:2;min-height:40px">Save as default</button></div>
</section>
</div>
<script src="fallback.js"></script>
</body>
</html>
