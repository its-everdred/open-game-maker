<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove editor</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 17px Fredoka;color:#f2ead6;flex:none;background:var(--gloss),rgba(116,200,237,.26)}
.orb.info{background:var(--gloss),#74c8ed;color:#1d1b16;border-color:rgba(255,255,255,.55)}
.flat{width:40px;height:40px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;padding:0;background:transparent;color:#c4beb0}
.flat.add{background:rgba(116,200,237,.18);color:#74c8ed}
.flat.send{background:#74c8ed;color:#1d1b16}
.row .bare{flex:1;min-width:0;height:36px;border:0;background:transparent;outline:none;padding:0;color:#f2ead6;font:600 16px Nunito}
.row .bare::placeholder{color:rgba(242,234,214,.45)}</style>
</head>
<body>
<div class="g phone">
<div class="glows" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top">
<a class="orb sm" href="AccessEntry.html" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="h1" style="font-size:26px;line-height:40px;flex:1">Editors</h1>
<a class="orb sm info" href="AccessAdd.html" aria-label="Add editor"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<div style="position:absolute;inset:76px 14px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<p class="sub" style="margin:0;padding:0 6px">Editors can edit, chat with agents and review rounds.</p>
<div class="sec"><div class="cap">Owner</div>
<div class="row"><span class="av">K</span><div class="grow"><div class="t" style="font-size:16px">Kevin</div><div class="s">Admin</div></div></div>
</div>
<div class="sec"><div class="cap">Editors <span class="cnt">2</span></div>
<div class="row"><span class="av">K</span><div class="grow"><div class="t" style="font-size:16px">Kim</div><div class="s">Game maker</div></div><a class="flat" href="AccessRemove.html" aria-label="Remove Kim"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
<div class="row"><span class="av">T</span><div class="grow"><div class="t" style="font-size:16px">[Tester]</div><div class="s">Player</div></div><a class="flat" href="Access.html" aria-label="Remove [Tester]"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
</div>
</div>
<div class="scrim" style="z-index:6"></div>
<div class="pane strong" role="dialog" aria-label="Remove Kim" style="position:absolute;left:10px;right:10px;bottom:10px;z-index:7;border-radius:28px;padding:24px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:16px">
<span class="av" style="width:64px;height:64px;font-size:28px">K</span>
<h2 class="h2" style="margin:0">Remove Kim?</h2>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">
<a class="btn danger block" href="Access.html">Remove</a>
<a class="btn ghost block" href="Access.html">Cancel</a>
</div>
</div>
</div>

</html>
