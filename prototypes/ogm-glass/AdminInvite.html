<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.chk{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:22px;border:1px solid rgba(242,234,214,.16);background:rgba(57,54,67,.5);font:700 14px Nunito;color:#f2ead6}
.chk img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.chk[aria-pressed="true"]{border-color:#d795e4;background:rgba(215,149,228,.16)}
.amt{display:flex;align-items:center;gap:10px}
.amt .input{width:96px;text-align:right;height:44px}</style>
</head>
<body>
<div class="g phone">
<div class="glows" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top">
<a class="orb sm" href="Admin.html" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="h1" style="font-size:26px;line-height:40px">Invite</h1>
</div>
<form style="position:absolute;inset:76px 14px 0;display:flex;flex-direction:column;gap:18px">
<div class="field"><label for="ai-email">Email</label><input id="ai-email" class="input" type="email"></div>
<div class="sec"><div class="cap">Role</div>
<div class="seg" role="group" aria-label="Role"><button type="button" aria-pressed="true">Player</button><button type="button" aria-pressed="false">Game maker</button><button type="button" aria-pressed="false">Admin</button></div>
</div>
<div class="sec"><div class="cap">Early access</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button type="button" class="chk" aria-pressed="true"><img src="../../assets-local/review/design-ogm-glass/img/dusk.jpg" alt="">Dusk Helm</button>
</div>
</div>
<div class="sec"><div class="cap">Allowance</div>
<div class="row amt"><img src="img/minerals.svg" alt="" style="width:24px;height:24px"><label for="ai-min" class="t grow" style="font-size:16px">Minerals</label><input id="ai-min" class="input" placeholder="[share]"></div>
<div class="row amt"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7f171"></stop><stop offset=".55" stop-color="#46c46a"></stop><stop offset="1" stop-color="#1f8a52"></stop></linearGradient></defs><path d="M4 18.5 6.2 11l4-2.6 4.6 1.2 3.4 3.6.8 5.3-3.8 1.7H7.6z" fill="url(#gg)"></path></svg><label for="ai-gas" class="t grow" style="font-size:16px">Gas</label><input id="ai-gas" class="input" placeholder="[$]"></div>
</div>
<button class="btn go block" type="submit" style="margin-top:auto;margin-bottom:24px">Send invite</button>
</form>
</div>
<script src="fallback.js"></script>
</body>
</html>
