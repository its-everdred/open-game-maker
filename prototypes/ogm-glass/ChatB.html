<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat B</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.pick{position:relative;flex:1;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0;background:#000;aspect-ratio:1;height:auto;display:block}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick span{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 15px Fredoka;color:#1d1b16;background:var(--gloss),#ff9133}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div class="pane strong" style="position:absolute;left:0;right:0;bottom:0;top:0;border-radius:0;display:flex;flex-direction:column">
<div style="height:8px"></div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 12px 8px 18px">
<div style="flex:1;min-width:0"><div class="h3" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Warmer torches</div><div style="display:flex;gap:6px;align-items:center;margin-top:4px"><span class="pill work">Working</span><span class="sub" style="font-size:13px">Dusk Helm</span></div></div>
<a class="orb sm" href="Activity.html" aria-label="All conversations"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#d795e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg></a>
<a class="orb sm" href="Editor.html" aria-label="Minimise"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
</div>
<div style="padding:0 14px 8px"><img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="Current scene" style="width:100%;height:150px;object-fit:cover;border-radius:16px;display:block"></div>
<div class="thread" style="flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;justify-content:flex-end">
<div class="msg me">The torches look too cold. Make them warmer.</div>
<div class="step"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94d742" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Found the torch light settings</div>
<div class="step"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94d742" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Rendered two looks</div>
<div class="msg a" style="max-width:100%;width:100%">Which one?
<div style="display:flex;gap:8px;margin-top:10px">
<button class="pick" aria-label="A"><img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="filter:sepia(.35) saturate(1.3) brightness(1.05)"><span>A</span></button>
<button class="pick" aria-label="B" style="border-color:#ff9133"><img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="filter:sepia(.6) saturate(1.6) hue-rotate(-12deg)"><span>B</span></button>
</div>
</div>
</div>
<div style="padding:0 10px 12px">
<div class="composer pane" style="box-shadow:none">
<button class="orb sm" aria-label="Attach"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<span class="in">Ask for a change</span>
<button class="orb sm" aria-label="Dictate"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
<a class="orb sm live" href="VoiceLive.html" aria-label="Talk live" style="color:#1d1b16"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h1M8 8v8M12 5v14M16 8v8M20 12h-1"></path></svg></a>
</div>
</div>
</div>
</div>
<script src="fallback.js"></script>
</body>
</html>
