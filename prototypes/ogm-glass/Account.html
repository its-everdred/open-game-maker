<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}</style>
</head>
<body>
<div class="g phone">
<div class="glows" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="top">
<a class="orb sm" href="Settings.html" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 class="h1" style="font-size:26px;line-height:40px">Account</h1>
</div>
<div style="position:absolute;inset:80px 14px 14px;display:flex;flex-direction:column;gap:20px">
<div class="pane" style="padding:18px;display:flex;align-items:center;gap:14px">
<span style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--gloss),#a95bd1;font:700 24px Fredoka;color:#1d1b16">K</span>
<div style="flex:1;min-width:0"><div class="h3">Kim</div><div class="sub">kim@example.com</div></div>
</div>
<div class="sec">
<div class="cap">Role</div>
<div class="row" style="flex-wrap:wrap;gap:8px"><span class="tag" style="border-color:#94d742;color:#f2ead6">Player</span><span class="tag" style="border-color:#ffbf32;color:#f2ead6">Game maker</span><span class="tag" style="border-color:#d795e4;color:#f2ead6">Admin</span></div>
</div>
<div class="sec">
<div class="cap">View the app as</div>
<div class="seg" role="group" aria-label="View as"><button aria-pressed="false">Player</button><button aria-pressed="true">Game maker</button><button aria-pressed="false">Admin</button></div>
</div>
<div class="sec">
<div class="cap">Sign-in</div>
<div class="row"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M15 12v2"></path></svg><div class="grow"><div class="t" style="font-size:16px">Passkeys</div><div class="s">This phone</div></div><button class="btn sm">Add</button></div>
<div class="row"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg><div class="grow"><div class="t" style="font-size:16px">Email link</div><div class="s">kim@example.com</div></div></div>
</div>
<button class="row" style="color:#ff9b8f;margin-top:auto"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"></path></svg><span class="t grow" style="font-size:16px">Sign out</span></button>
</div>
</div>
</body>
</html>
