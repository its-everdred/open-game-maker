<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model and effort</title>
<link rel="stylesheet" href="./glass.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e16}a{color:#74c8ed}a:hover{color:#f2ead6}
.m{display:flex;align-items:center;gap:12px}
.m .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#393643;font:800 13px Nunito;flex:none}</style>
</head>
<body>
<div class="g phone">
<img src="../../assets-local/review/design-ogm-glass/img/play-bg.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div class="pane strong" style="position:absolute;left:0;right:0;bottom:0;top:300px;border-radius:28px 28px 0 0;padding:18px 14px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:10px"><h1 class="h2" style="flex:1">Warmer torches</h1><a class="orb sm" href="AgentChat.html" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
<div class="sec"><div class="cap">Model order</div>
<div class="row m"><span class="n">1</span><span class="t grow" style="font-size:16px">[first model]</span><span class="pill done">In use</span></div>
<div class="row m"><span class="n">2</span><span class="t grow" style="font-size:16px">[fallback model]</span></div>
</div>
<div class="sec"><div class="cap">Effort</div>
<div class="seg" role="group" aria-label="Effort"><button aria-pressed="false">Low</button><button aria-pressed="true">Medium</button><button aria-pressed="false">High</button></div>
</div>
<div class="meter"><div class="hd"><img src="img/minerals.svg" alt="" style="width:20px;height:20px">This chat so far<b>2%</b></div></div>
</div>
</div>
<script src="fallback.js"></script>
</body>
</html>
