<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HD-2D · Lit motes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101720; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 960px); height: min(100vh, 600px); }
    .caption { position: fixed; left: 16px; bottom: 12px; color: #dce4e6; font: 12px ui-monospace, monospace; opacity: .72; }
  </style>
</head>
<body>
  <div class="caption">PROCEDURAL PROOF · THREE.JS 0.186 · DEPTH-BANDED MOTES</div>
  <script type="module">
    import * as THREE from '../../node_modules/.pnpm/three@0.186.1/node_modules/three/build/three.module.js';
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101720);
    scene.fog = new THREE.FogExp2(0x101720, 0.085);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 80);
    camera.position.set(0, 2.6, 10);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(960, 600);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);
    const warm = new THREE.PointLight(0xff9a50, 65, 9, 2); warm.position.set(-2.4, 1.1, 0); scene.add(warm);
    const fill = new THREE.AmbientLight(0x7893a5, 1.4); scene.add(fill);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 12), new THREE.MeshStandardMaterial({ color: 0x27353a, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -1.25; scene.add(floor);
    for (let i = 0; i < 9; i++) {
      const x = -5 + i * 1.25, h = 1.3 + (i % 4) * 0.42;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.17, h, 5), new THREE.MeshStandardMaterial({ color: i % 2 ? 0x384539 : 0x4a4638, roughness: 1 }));
      trunk.position.set(x, -1.25 + h / 2, -1.4 - (i % 3) * 0.7); scene.add(trunk);
      const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(0.72 + (i % 3) * 0.18, 0), new THREE.MeshStandardMaterial({ color: i % 2 ? 0x354a3b : 0x4a5637, roughness: 1, flatShading: true }));
      canopy.position.set(x, -0.05 + h * 0.68, trunk.position.z); scene.add(canopy);
    }
    const count = 150, positions = new Float32Array(count * 3), colors = new Float32Array(count * 3), sizes = new Float32Array(count);
    const seeds = new Float32Array(count), depths = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      seeds[i] = (i * 0.61803398875) % 1; depths[i] = (i * 0.754877666) % 1;
      positions[i * 3] = (seeds[i] - 0.5) * 10;
      positions[i * 3 + 1] = -1 + (i * 0.317) % 4.4;
      positions[i * 3 + 2] = 2.2 - depths[i] * 5;
      const ember = i % 5 === 0;
      const c = new THREE.Color(ember ? 0xff7440 : (i % 3 ? 0xf7cf86 : 0xa9d7d4));
      colors.set([c.r, c.g, c.b], i * 3); sizes[i] = ember ? 0.07 : 0.035 + depths[i] * 0.025;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    const material = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `attribute float size; attribute float seed; varying vec3 vColor; varying float vSeed; void main(){ vColor=color; vSeed=seed; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*460.0/max(1.0,-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying vec3 vColor; varying float vSeed; void main(){ vec2 p=gl_PointCoord-0.5; float r=length(p); float halo=exp(-r*12.0)*0.42; float core=smoothstep(0.22,0.02,r); float twinkle=0.68+0.32*sin(vSeed*91.0); float a=(halo+core*0.55)*twinkle; gl_FragColor=vec4(vColor*a,a); }` });
    material.vertexColors = true;
    const moteCloud = new THREE.Points(geometry, material); scene.add(moteCloud);
    let last = 0;
    function frame(ms) {
      const t = ms * 0.001, dt = Math.min(0.04, (ms - last) * 0.001 || 0); last = ms;
      const a = geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        const y = i * 3 + 1, x = i * 3;
        a[y] += dt * (0.12 + seeds[i] * 0.18);
        a[x] += dt * (Math.sin(t * 0.55 + depths[i] * 6) * 0.12 + 0.035);
        if (a[y] > 3.5) { a[y] = -1.1; a[x] = (seeds[i] - 0.5) * 10; }
      }
      geometry.attributes.position.needsUpdate = true;
      warm.intensity = 58 + Math.sin(t * 2.1) * 9;
      moteCloud.rotation.y = Math.sin(t * 0.17) * 0.04;
      renderer.render(scene, camera); requestAnimationFrame(frame);
    }
    function resize() {
      const w = Math.min(innerWidth, 960), h = Math.min(innerHeight, 600);
      renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
  </script>
</body>
</html>
