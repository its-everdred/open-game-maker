<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HD-2D depth focus: layered experiment</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; background: #10151c; color: #e5e8df; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    header { display:flex; align-items:baseline; justify-content:space-between; gap: 20px; margin: 0 auto 14px; max-width: 1120px; }
    h1 { font: 600 17px/1.2 system-ui,sans-serif; margin: 0; }
    #mode { color:#9fb4c6; }
    main { max-width: 1120px; margin:auto; }
    .stage { height: min(66vh, 600px); min-height: 370px; position:relative; overflow:hidden; background:#152630; image-rendering: pixelated; isolation:isolate; }
    .band { position:absolute; inset:0; transition: filter .25s ease; }
    .sky { background: linear-gradient(#263a4a 0%,#789090 48%,#c89468 100%); }
    .distant { top:17%; height:60%; background:linear-gradient(160deg, transparent 10%,#4d6160 10% 32%,transparent 32%),linear-gradient(20deg,transparent 28%,#526360 28% 52%,transparent 52%); opacity:.76; }
    .ridge { top:29%; height:55%; background:linear-gradient(168deg,transparent 0 20%,#344b4b 20% 60%,transparent 60%),linear-gradient(12deg,transparent 0 28%,#415551 28% 67%,transparent 67%); }
    .ground { top:57%; height:45%; background:repeating-linear-gradient(0deg,#344339 0 13px,#46503d 13px 14px); transform:perspective(300px) rotateX(12deg) scale(1.3); transform-origin:top; }
    .hero { position:absolute; width:24px;height:47px; left:50%; top:55%; transform:translate(-50%,-50%); image-rendering:pixelated; filter:drop-shadow(0 7px 1px #202c2c); }
    .hero::before { content:"";position:absolute;left:4px;top:0;width:16px;height:14px;background:#e2b17c;box-shadow:0 13px #b95543, -4px 17px #587d85,4px 17px #587d85, -4px 31px #303b49,4px 31px #303b49; }
    .tree { position:absolute; width:42px;height:100px; bottom:0; background:linear-gradient(90deg,#544c3e 0 30%,#75644c 30% 50%,#4c493d 50%); }
    .tree::before { content:""; position:absolute; width:98px;height:68px;left:-28px;top:-36px;background:#233d39;clip-path:polygon(50% 0,100% 75%,72% 75%,88% 100%,14% 100%,28% 75%,0 75%); }
    .tree.left { left:7%;height:130px; transform:scale(1.2); }
    .tree.right { right:9%;height:115px; }
    .sprite { position:absolute; width:16px;height:24px;background:#d48f51; bottom:31%; image-rendering:pixelated; box-shadow:0 -8px 0 -2px #e9bd78; }
    .sprite.a { left:28%; }.sprite.b { right:30%; transform:scale(.8); }
    .labels { position:absolute; inset:0; pointer-events:none; }
    .label { position:absolute; padding:3px 6px; background:#111a20c9; color:#e8e7d7; font-size:11px; }
    .l1 { left:12px;top:12px; }.l2 { right:12px;top:12px; }.l3 { left:12px;bottom:12px; }
    .controls { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
    button { border:1px solid #62727a; background:#202b33; color:inherit; padding:7px 10px; font:inherit; cursor:pointer; }
    button[aria-pressed="true"] { border-color:#d7a968; color:#ffd799; }
    #status { color:#aeb9b9; margin-left:auto; }
    @media(max-width:600px) { body{padding:10px}.stage{min-height:330px;height:60vh}header{align-items:flex-start;flex-direction:column;gap:4px}#status{width:100%;margin:4px 0} }
  </style>
</head>
<body>
  <header><h1>Depth focus · layered renderer</h1><span id="mode">A/B: global miniature blur · depth bands · sharp focal sprite</span></header>
  <main>
    <section class="stage" id="stage" aria-label="Procedural pixel-art layered scene">
      <div class="band sky"></div><div class="band distant"></div><div class="band ridge"></div><div class="band ground"></div>
      <div class="tree left"></div><div class="tree right"></div><div class="sprite a"></div><div class="sprite b"></div><div class="hero" id="hero"></div>
      <div class="labels"><span class="label l1">FAR PLANE</span><span class="label l2">MID PLANE</span><span class="label l3">NEAR PLANE</span></div>
    </section>
    <nav class="controls" aria-label="Rendering modes">
      <button data-mode="off" aria-pressed="true">No blur</button><button data-mode="tilt">Tilt-shift</button><button data-mode="layers">Layer blur</button><button data-mode="pixel">Pixel protect</button><button id="move">Move focus</button><span id="status">All geometry is painter-sorted; depth is authored as layer metadata.</span>
    </nav>
  </main>
  <script>
    const stage = document.querySelector('#stage');
    const labels = [...document.querySelectorAll('.label')];
    const bands = [...document.querySelectorAll('.band')];
    const hero = document.querySelector('#hero');
    const status = document.querySelector('#status');
    const buttonList = [...document.querySelectorAll('[data-mode]')];
    let focus = .55, mode = 'off';
    const apply = () => {
      bands.forEach((band, i) => band.style.filter = '');
      hero.style.filter = 'drop-shadow(0 7px 1px #202c2c)';
      if (mode === 'tilt') bands.forEach((band, i) => band.style.filter = `blur(${Math.max(0, Math.abs((i*0.31)-focus)-.18)*15}px)`);
      if (mode === 'layers') { bands[1].style.filter = 'blur(1px)'; bands[2].style.filter = `blur(${Math.abs(.45-focus)*11}px)`; bands[3].style.filter = `blur(${Math.abs(.83-focus)*11}px)`; }
      if (mode === 'pixel') { bands[1].style.filter='blur(1px)'; bands[2].style.filter=`blur(${Math.abs(.45-focus)*8}px)`; bands[3].style.filter=`blur(${Math.abs(.83-focus)*8}px)`; }
      buttonList.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      status.textContent = `focus y=${focus.toFixed(2)} · ${mode === 'pixel' ? 'hero sprite is independently composited and stays crisp' : 'the final image-space blur also blurs sprites'} · ${devicePixelRatio.toFixed(1)}× DPR`;
    };
    buttonList.forEach(button => button.addEventListener('click', () => { mode=button.dataset.mode; apply(); }));
    document.querySelector('#move').addEventListener('click', () => { focus = focus < .7 ? .79 : .43; hero.style.top = `${focus*100}%`; apply(); });
    apply();
  </script>
</body>
</html>
