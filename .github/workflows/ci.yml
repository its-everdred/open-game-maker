name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GM_VERIFY_SOFTWARE_GL: '1'

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.detect.outputs.browser }}
      voice_host: ${{ steps.detect.outputs.voice_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          browser_paths=(
            apps/web/
            packages/sdk/
            packages/contracts/
            packages/design-log/
            services/api/
            services/games-host/
            templates/
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .github/workflows/
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$MQ_BASE_SHA"
            head="$MQ_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            diff_available=false
          else
            diff_available=true
          fi

          if [[ "$EVENT_NAME" != "pull_request" || "$diff_available" != "true" ]]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$head" -- "${browser_paths[@]}"; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "browser=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$diff_available" != "true" ]]; then
            echo "voice_host=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$head" -- services/voice-host/ .github/workflows/ci.yml; then
            echo "voice_host=false" >> "$GITHUB_OUTPUT"
          else
            echo "voice_host=true" >> "$GITHUB_OUTPUT"
          fi

  workspace:
    name: workspace
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable || npm i -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run lint
      - run: pnpm exec prettier --check .
      - run: node .github/scripts/check-ignore.mjs
      - run: node .github/scripts/check-host-names.mjs
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run typecheck
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run test
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run build
      - name: Core package publish dry run
        run: node packages/core-release/dist/bin.js publish --root . --dry-run
      - run: node .github/scripts/smoke-workspace.mjs

  browser:
    name: browser tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable || npm i -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run build
      - name: Browser tests (packages that declare test:browser)
        env:
          BROWSER_CHANGED: ${{ needs.changes.outputs.browser }}
        run: |
          if [[ "$BROWSER_CHANGED" != "true" ]]; then
            echo "browser tests skipped: no browser-relevant paths changed"
            exit 0
          fi

          browser_package=$(grep -rls '"test:browser"' --include=package.json apps packages services skills templates 2>/dev/null | head -n 1)
          if [[ -n "$browser_package" ]]; then
            pnpm --dir "$(dirname "$browser_package")" exec playwright install --with-deps chromium
            pnpm -r --if-present run test:browser
          else
            echo "no browser tests"
          fi

  ops:
    name: ops shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable || npm i -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '!ogm' --filter '!@ogm/voice-host' -r --if-present run build
      - name: Install Chromium
        run: pnpm --dir packages/gm-verify exec playwright install --with-deps chromium
      - name: Ops shell tests (ops/test/*.sh, added by OGM-002/006/008)
        run: |
          shopt -s nullglob; rc=0
          for t in ops/test/*.sh; do echo "== $t"; bash "$t" || rc=1; done
          exit $rc

  voice_host:
    name: voice host
    needs: changes
    if: needs.changes.outputs.voice_host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          working_directory: services/voice-host
          cache: true
      - name: Cache Mix dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            services/voice-host/deps
            services/voice-host/_build
          key: voice-host-mix-${{ runner.os }}-${{ hashFiles('services/voice-host/mise.toml', 'services/voice-host/mix.lock') }}
          restore-keys: |
            voice-host-mix-${{ runner.os }}-
      - name: Fetch voice-host dependencies
        working-directory: services/voice-host
        run: mise exec -- mix deps.get
      - name: Compile voice host
        working-directory: services/voice-host
        run: mise exec -- mix compile --warnings-as-errors
      - name: Check voice-host formatting
        working-directory: services/voice-host
        run: mise exec -- mix format --check-formatted
      - name: Test voice host
        working-directory: services/voice-host
        run: mise exec -- mix test

  required:
    name: required
    needs: [changes, workspace, browser, ops, voice_host]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          OPS_RESULT: ${{ needs.ops.result }}
          VOICE_HOST_RESULT: ${{ needs.voice_host.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "success" && "$WORKSPACE_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$OPS_RESULT" == "success" && ( "$VOICE_HOST_RESULT" == "success" || "$VOICE_HOST_RESULT" == "skipped" ) ]]; then
            exit 0
          fi

          echo "required check failed: changes=$CHANGES_RESULT workspace=$WORKSPACE_RESULT browser=$BROWSER_RESULT ops=$OPS_RESULT voice-host=$VOICE_HOST_RESULT" >&2
          exit 1
