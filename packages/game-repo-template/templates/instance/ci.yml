name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run typecheck
          else
            pnpm -r --if-present run typecheck
          fi
      - name: Test changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run test
          else
            pnpm -r --if-present run test
          fi
      - name: Build changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run build
          else
            pnpm -r --if-present run build
          fi
      # Every mode of every game whose screens or play changed, played by a seeded bot at the four touch sizes (#866).
      # A core bump or shared package change can break any game, so it plays them all.
      - name: Playtest changed games in every mode
        if: github.event_name == 'pull_request'
        env:
          GM_VERIFY_SOFTWARE_GL: '1'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          if grep -qE '^(packages/|vendor/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)' <<< "$changed"; then
            games=$(ls -d games/*/ 2> /dev/null | sed 's#/$##' || true)
          else
            games=$(grep -E '^games/[^/]+/(src/|index\.html|design/|public/|assets/|gm\.manifest\.json)' <<< "$changed" |
              cut -d/ -f1-2 | sort -u || true)
          fi
          [[ -n $games ]] || exit 0
          if [[ ! -x node_modules/.bin/gm ]]; then
            echo '::error::gm qa playtest needs the vendored Game Maker core (@ogm/gm-cli); run pnpm vendor:core'
            exit 1
          fi
          playwright=$(ls -d node_modules/.pnpm/@ogm+gm-verify@*/node_modules/playwright | head -n 1)
          node "$playwright/cli.js" install --with-deps chromium
          status=0
          for game in $games; do
            [[ -f $game/gm.manifest.json ]] || continue
            pnpm exec gm qa playtest "$game" --all-modes || status=1
          done
          exit "$status"
      - name: Check changed trailers
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          dirs="$(git diff --name-only --diff-filter=d "$base" HEAD -- 'games/*/**/trailer*.mp4' 'games/*/**/trailer*.webm' 'games/*/**/trailer*.mov' 'games/*/**/trailer-landscape.frames.json' | xargs -r -n1 dirname | sort -u)"
          [[ -z "$dirs" ]] && exit 0
          command -v ffprobe >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg; }
          for dir in $dirs; do pnpm exec gm trailer "$(cut -d/ -f2 <<<"$dir")" --check --dir "$dir"; done
