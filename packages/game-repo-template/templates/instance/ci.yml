name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run typecheck
          else
            pnpm -r --if-present run typecheck
          fi
      - name: Test changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run test
          else
            pnpm -r --if-present run test
          fi
      - name: Build changed packages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[$base]" --if-present run build
          else
            pnpm -r --if-present run build
          fi
      # Every mode of every game whose screens or play changed, played by a seeded bot at the four touch sizes (#866).
      - name: Playtest changed games in every mode
        if: github.event_name == 'pull_request'
        env:
          GM_VERIFY_SOFTWARE_GL: '1'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          games=$(git diff --name-only "$base" HEAD -- 'games/*/src/**' 'games/*/index.html' 'games/*/design/**' \
            'games/*/public/**' 'games/*/assets/**' 'games/*/gm.manifest.json' | cut -d/ -f1-2 | sort -u)
          [[ -n $games ]] || exit 0
          playwright=$(ls -d node_modules/.pnpm/@ogm+gm-verify@*/node_modules/playwright | head -n 1)
          node "$playwright/cli.js" install --with-deps chromium
          status=0
          for game in $games; do
            [[ -f $game/gm.manifest.json ]] || continue
            pnpm gm qa playtest "$game" --all-modes || status=1
          done
          exit "$status"
