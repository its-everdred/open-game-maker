<!doctype html>
<!-- A hosted-build stand-in for the gm qa browser tests: no test hooks, a DOM menu, a canvas board, keyboard and swipe
     input, and rooms on the test server's /room API (create, join, seats, a countdown from the server's start time,
     moves, and presence that lapses when a page goes away). -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<style>
  body {
    margin: 0;
    font: 20px sans-serif;
    background: #123;
    color: #fff;
  }
  #menu,
  #lobby {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  button {
    font-size: 20px;
    margin: 4px;
  }
</style>
<div id="menu"><button id="play">Play</button><button id="create">Create room</button></div>
<div id="lobby" hidden>
  <span id="code"></span> <span id="seats"></span> <span id="count"></span> <span id="score"></span>
</div>
<canvas id="c"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const $ = (id) => document.getElementById(id);
  let xs = [0];
  let mine = 0;
  let room = null;
  if (q.has('noisy')) console.error('qa stub noise');
  if (q.has('blank')) document.documentElement.style.cssText = 'background: #000; visibility: hidden';
  function draw() {
    c.width = innerWidth;
    c.height = innerHeight;
    g.fillStyle = '#246';
    g.fillRect(0, 0, c.width, c.height);
    xs.forEach((x, seat) => {
      g.fillStyle = ['#fc0', '#0cf', '#f0c', '#0f6'][seat % 4];
      g.fillRect(20 + x * 40, 300 + seat * 60, 40, 40);
    });
  }
  async function api(path, body) {
    const res = await fetch(path, { method: body ? 'POST' : 'GET', body: body ? JSON.stringify(body) : undefined });
    return res.json();
  }
  function move(dx) {
    if (room) api(`/room/${room.code}/move`, { token: room.token, dx });
    else {
      xs[0] = Math.max(0, xs[0] + dx);
      $('score').textContent = `Score ${xs[0]}`;
      draw();
    }
  }
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
  });
  let touchX = null;
  addEventListener('touchstart', (e) => (touchX = e.touches[0].clientX));
  addEventListener('touchmove', (e) => ((touchX ??= e.touches[0].clientX), (window.lastTouch = e.touches[0].clientX)));
  addEventListener('touchend', () => {
    if (touchX !== null && window.lastTouch !== undefined && Math.abs(window.lastTouch - touchX) > 30)
      move(window.lastTouch > touchX ? 1 : -1);
    touchX = null;
    window.lastTouch = undefined;
  });
  $('play').onclick = () => {
    $('menu').hidden = true;
    $('lobby').hidden = false;
    $('score').textContent = 'Score 0';
  };
  async function enter(code) {
    const token = localStorage.getItem(`seat:${code}`) ?? undefined;
    room = await api(`/room/${code}/join`, { token });
    localStorage.setItem(`seat:${code}`, room.token);
    mine = room.seat;
    history.replaceState(null, '', `?room=${code}`);
    $('menu').hidden = true;
    $('lobby').hidden = false;
    $('code').textContent = code;
    setInterval(poll, 100);
  }
  async function poll() {
    const state = await api(`/room/${room.code}?token=${room.token}`);
    xs = state.xs;
    $('seats').textContent = `${state.present} players`;
    if (state.startAt) {
      const left = Math.ceil((state.startAt - state.now) / 1000);
      $('count').textContent = left > 0 ? `Starting ${left}` : 'Go';
    }
    if (mine === 0 && !state.startAt && state.present >= 2 && !$('start')) {
      const b = document.createElement('button');
      b.id = 'start';
      b.textContent = 'Start';
      b.onclick = () => api(`/room/${room.code}/start`, { token: room.token });
      $('lobby').append(b);
    }
    draw();
  }
  $('create').onclick = async () => enter((await api('/room/create', {})).code);
  if (q.has('room')) enter(q.get('room'));
  draw();
</script>
