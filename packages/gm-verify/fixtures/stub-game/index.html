<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<canvas id="c" style="position: fixed; inset: 0; width: 100%; height: 100%"></canvas>
<script>
  const c = document.getElementById('c'),
    g = c.getContext('webgl', { preserveDrawingBuffer: true }),
    q = new URLSearchParams(location.search);
  let t = 0,
    lastAction = null,
    restored = false,
    throwOnAdvance = false;
  const stepMs = 1000 / 60;
  if (q.has('boom')) throw new Error('stub exploded before ready');
  function draw() {
    c.width = innerWidth;
    c.height = innerHeight;
    g.viewport(0, 0, c.width, c.height);
    if (q.has('blank')) {
      g.clearColor(0, 0, 0, 1);
      g.clear(g.COLOR_BUFFER_BIT);
      return;
    }
    const s = ((t / 1000) % 3) / 3;
    g.clearColor(s, 0.4, 1 - s, 1);
    g.clear(g.COLOR_BUFFER_BIT);
    g.enable(g.SCISSOR_TEST);
    g.scissor((s * c.width) | 0, 0, 40, c.height);
    g.clearColor(1, 1, 1, 1);
    g.clear(g.COLOR_BUFFER_BIT);
    g.disable(g.SCISSOR_TEST);
  }
  if (q.has('noisy')) console.error('stub noise');
  window.__gm = {
    ready: true,
    marks: [],
    advanceTime(ms) {
      if (q.has('stall')) return new Promise(() => {});
      if (throwOnAdvance) throw new TypeError('Cannot advance crashed game state');
      const throwAt = Number(q.get('throwAt'));
      if (q.has('throwAt') && Number.isFinite(throwAt) && Math.floor((t + ms) / stepMs) >= throwAt) {
        throw new Error(`stub threw on tick ${throwAt}`);
      }
      t += ms;
    },
    renderAt(ms) {
      t = ms;
      draw();
    },
    renderGameToText() {
      return {
        coords: 'x right, y down',
        tick: Math.round(t / stepMs),
        mode: 'play',
        state: restored ? { alive: true, lastAction, t } : { t, lastAction, alive: true },
        players: [],
      };
    },
    renderInfo() {
      return { calls: 1, triangles: q.has('heavy') ? 410000 : 2, frameMs: 1, textureBytes: 0, backend: 'webgl' };
    },
    hitTest: () => false,
    setSeed() {},
    inject(f) {
      lastAction = Object.keys(f.actions)[0];
      if (f.actions.crash) throw new TypeError("Cannot read properties of undefined (reading 'speed')");
      if (f.actions.advanceCrash) throwOnAdvance = true;
    },
    restore(save) {
      const state = save && 'data' in save ? save.data : save;
      t = state.t;
      lastAction = state.lastAction;
      restored = true;
      draw();
    },
    probes() {
      return { tick: Math.round(t / stepMs), alive: true, ...(lastAction ? { lastAction } : {}) };
    },
  };
  if (q.has('noRestore')) delete window.__gm.restore;
  draw();
  postMessage('stub-ready', '*');
</script>
